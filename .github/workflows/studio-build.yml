# ⚠️  CENTRALLY MANAGED FILE — DO NOT EDIT LOCALLY!
#
# This file is distributed from coreshop/workflow-collection via file sync
# (source: templates/studio-build.yml). Local changes will be overwritten by the
# next sync run via PR.

name: Studio Frontend Build

# Only the Studio sources and what the build inlines from vendor/ influence the
# packaged build, so only they trigger a run. The commit that carries the
# packaged build touches nothing but Resources/build-dist, which is not in
# this list, so it never triggers another (no-op) run. It deliberately carries
# no `[skip ci]` marker.
on:
  pull_request:
    branches: [ '*.x' ]
    paths:
      - 'src/**/Resources/assets/pimcore-studio/**'
      - 'composer.json'
      - '.github/workflows/studio-build.yml'
  # Pushes to a version branch commit the packaged build. Release branches are
  # covered by their pull request: a pull request from this repository builds
  # and commits the archive too, so the release pull request already carries
  # the final archive and the tag created right after the merge is complete. A
  # `push` trigger on `release/**` would start a second run for the same
  # commit that cancels the first one in the concurrency group below, and the
  # cancelled run counts as a failed check.
  push:
    branches: [ '*.x' ]
    paths:
      - 'src/**/Resources/assets/pimcore-studio/**'
      - 'composer.json'
      - '.github/workflows/studio-build.yml'
  workflow_dispatch:

# A newer push to the same branch supersedes a running build; the commit job of
# the reusable workflow only ever pushes the archive of the build it belongs to.
concurrency:
  group: studio-build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    uses: coreshop/workflow-collection/.github/workflows/studio-build.yml@v1
    # A called workflow gets no secrets by default; needed for the optional
    # STUDIO_BUILD_APP_* credentials.
    secrets: inherit
    with:
      # Pull requests from this repository get their archive committed like the
      # version and release branches do, so a pull request always carries the
      # build of its own sources. Pull requests from forks and manual runs
      # build for verification only: a fork must not get its code near a
      # write-capable token, and a manual run on a feature branch must not
      # push to it.
      commit: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
      # The template defaults to PHP 8.3; a CoreShop 2026.x bundle needs 8.4 for
      # `composer install`. Only the vendor sources are needed, so one version
      # is enough. See docs/GUARDRAILS.md, "PHP and Pimcore versions".
      php_version: '8.4'
